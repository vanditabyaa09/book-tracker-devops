apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: book-tracker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vanditabyaa09/book-tracker-devops.git
    targetRevision: main
    path: helm/book-tracker
  destination:
    server: https://kubernetes.default.svc
    namespace: book-tracker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
