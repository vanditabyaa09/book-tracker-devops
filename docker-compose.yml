services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: books
      POSTGRES_PASSWORD: books   # local dev only, documented in README as a limitation
      POSTGRES_DB: books
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books -d books"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://books:books@postgres:5432/books
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend

volumes:
  pgdata: